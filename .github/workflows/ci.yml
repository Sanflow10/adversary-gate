name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # AG-005/AG-006: the suite must run against an *installed* package on a
      # clean runner, not against whatever happens to be preinstalled.
      - name: Install package and test dependencies
        run: python -m pip install .

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Run test suite
        run: python -m pytest -q

  package:
    name: Build, install wheel, smoke the CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install the built wheel in a clean interpreter
        run: python -m pip install dist/*.whl

      - name: CLI entry point answers --help
        run: adversary-gate --help

      - name: Installed CLI refuses an untrusted coverage claim
        # The AG-002 contract: a bare --coverage-ratio is a usage error.
        run: |
          mkdir -p fixture/baseline fixture/patch
          printf 'def add(a, b):\n    return a + b\n' > fixture/baseline/calc.py
          printf 'def add(a, b):\n    return a + b\n' > fixture/patch/calc.py
          for d in baseline patch; do
            printf 'from calc import add\n\ndef test_add():\n    assert add(2, 2) == 4\n' \
              > fixture/$d/test_sum.py
          done
          set +e
          adversary-gate \
            --baseline fixture/baseline \
            --patch fixture/patch \
            --test-path test_sum.py \
            --test-id test_add \
            --coverage-ratio 1.0
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3

  action-smoke:
    name: Composite action on a clean runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the baseline/patch fixture
        run: |
          mkdir -p baseline patch
          printf 'def add(a, b):\n    return a + b\n' > baseline/calc.py
          printf 'def add(a, b):\n    return (a + b)\n' > patch/calc.py
          for d in baseline patch; do
            printf 'from calc import add\n\ndef test_add():\n    assert add(2, 2) == 4\n' \
              > $d/test_sum.py
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("change.diff").write_text(
              "--- a/calc.py\n"
              "+++ b/calc.py\n"
              "@@ -1,2 +1,2 @@\n"
              " def add(a, b):\n"
              "-    return a + b\n"
              "+    return (a + b)\n"
          )
          Path("cov.json").write_text(
              json.dumps({"files": {"calc.py": {"executed_lines": [1, 2]}}})
          )
          PY

      - name: Run AdversaryGate from the repository
        id: gate
        uses: ./
        with:
          baseline: 'baseline'
          patch: 'patch'
          test-path: 'test_sum.py'
          test-id: 'test_add'
          diff: 'change.diff'
          coverage-json: 'cov.json'
          evidence-log: 'evidence.jsonl'

      - name: The gate must merge a clean, measured patch
        run: |
          echo "decision=${{ steps.gate.outputs.decision }}"
          echo "outcome=${{ steps.gate.outputs.outcome }}"
          test "${{ steps.gate.outputs.decision }}" = "merge"
          test "${{ steps.gate.outputs.outcome }}" = "verified"
          test -s evidence.jsonl

      # AG-016: a suite that is one command has no node IDs, so the Action
      # must not go on demanding `test-id`. Passing neither is still a usage
      # error -- this is the case where one of the two must be supplied.
      #
      # continue-on-error: the gate exits 2 here *by design*, and action.yml
      # ends with `exit $EXIT_CODE`, so the run step itself would go red before
      # its outputs could be asserted.
      - name: Build a suite that is not pytest
        run: |
          for d in baseline patch; do
            printf '#!/bin/sh\nexit 0\n' > "$d/run_tests.sh"
            chmod +x "$d/run_tests.sh"
          done

      - name: Run the gate with test-command and no test-id
        id: gate_cmd
        continue-on-error: true
        uses: ./
        with:
          baseline: 'baseline'
          patch: 'patch'
          test-path: 'run_tests.sh'
          test-command: './run_tests.sh'
          diff: 'change.diff'
          coverage-json: 'cov.json'
          evidence-log: 'evidence-cmd.jsonl'

      - name: The command ran on both sides, and no test-id was demanded
        run: |
          # The wiring this step exists for:
          #   1. it did NOT exit 3 -- test-id is genuinely optional now;
          #   2. the decision is the documented answer, not a defect:
          #      AG-012 keeps a suite it cannot mutate from merging, and a
          #      shell script leaves nothing for the mutation engine to break.
          #      --test-command buys a real PASS/FAIL (so BLOCK works);
          #      only a mutation adapter buys MERGE.
          #
          # The probe is emitted unconditionally because this job log is not
          # readable without push rights, while annotations are. A red job has
          # to be able to say *what* it saw.
          DECISION='${{ steps.gate_cmd.outputs.decision }}'
          OUTCOME='${{ steps.gate_cmd.outputs.outcome }}'
          echo "::notice::probe decision=$DECISION outcome=$OUTCOME evidence=$(tail -c 300 evidence-cmd.jsonl 2>&1 || echo '<absent>')"
          echo "decision=$DECISION"
          echo "outcome=$OUTCOME"
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$DECISION" ] || fail "the gate never produced a decision -- check for an exit 3 usage error"
          [ "$DECISION" = "inconclusive" ] || fail "decision is '$DECISION', expected 'inconclusive'"
          [ "$OUTCOME" = "verified" ] || fail "outcome is '$OUTCOME', expected 'verified'"

  prepare-evidence:
    # base-sha's plumbing lives in a script so it can be tested without a
    # runner. This asserts the artefacts it writes *and* that the gate accepts
    # them -- producing a diff is worthless if the decision that follows is
    # wrong -- plus both failure modes failing closed with a readable reason.
    name: base-sha artefacts (script)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pytest coverage

      - name: Run the prepare_evidence test
        run: bash scripts/test_prepare_evidence.sh

  action-base-sha:
    # The same path, but through the composite Action on a real runner: one
    # ref in, and baseline + diff + coverage derived from it. checkout needs
    # fetch-depth: 0 for base-sha to exist at all -- forgetting it is the
    # failure this job would otherwise be the first to hit.
    name: Composite action from base-sha
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit a fixture, then patch it
        run: |
          set -euo pipefail
          git config user.email "adversary-gate@example.com"
          git config user.name "adversary-gate"
          mkdir -p gate_fixture
          touch gate_fixture/__init__.py
          printf 'def add(a, b):\n    return a + b\n' > gate_fixture/calc.py
          printf 'from gate_fixture.calc import add\n\n\ndef test_add():\n    assert add(2, 2) == 4\n' > gate_fixture/test_calc.py
          git add gate_fixture
          git commit -qm "fixture: baseline side"
          echo "AG_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The patch keeps the claim green and only reshapes the expression,
          # so there is a real added line for diff coverage to judge.
          printf 'def add(a, b):\n    return (a + b)\n' > gate_fixture/calc.py
          git add -A
          git commit -qm "fixture: patch side"

      # continue-on-error so the assertion below still runs when the gate
      # does not merge -- otherwise a non-zero exit skips the only step that
      # could have said *why*, and the job reports nothing but a bare code.
      - name: Run AdversaryGate deriving everything from base-sha
        id: gate
        continue-on-error: true
        uses: ./
        with:
          base-sha: ${{ env.AG_BASE_SHA }}
          test-path: 'gate_fixture/test_calc.py'
          test-id: 'test_add'
          coverage-command: 'coverage run -m pytest gate_fixture || true; coverage json -o "$COVERAGE_JSON"'
          evidence-log: 'evidence-base-sha.jsonl'

      - name: One ref must be enough to merge
        run: |
          # Annotations, not the log: this log needs push rights to open.
          DECISION='${{ steps.gate.outputs.decision }}'
          OUTCOME='${{ steps.gate.outputs.outcome }}'
          echo "::notice::probe decision=$DECISION outcome=$OUTCOME evidence=$(tail -c 300 evidence-base-sha.jsonl 2>&1 || echo '<absent>')"
          echo "decision=$DECISION"
          echo "outcome=$OUTCOME"
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$DECISION" ] || fail "the Action produced no decision output -- the gate step died before writing it"
          [ "$DECISION" = "merge" ] || fail "decision is '$DECISION', expected 'merge'"
          [ "$OUTCOME" = "verified" ] || fail "outcome is '$OUTCOME', expected 'verified'"
          test -s evidence-base-sha.jsonl || fail "evidence-base-sha.jsonl is missing or empty"
          # Assert the contract, not the byte layout: the log is written with
          # separators=(",", ":"), so grepping for `": "` silently matches
          # nothing while the value is right there.
          python3 - <<'PY'
          import json, sys

          try:
              records = [json.loads(line) for line in open("evidence-base-sha.jsonl")]
              decision = [r for r in records if r.get("kind") == "decision"][-1]
          except Exception as exc:
              print(f"::error::evidence is unreadable: {exc}")
              sys.exit(1)

          # The four numbers that decide this job, each emitted on its own so
          # a failure is diagnosable from the annotations alone.
          mutation = decision.get("mutation") or {}
          for label, value in (
              ("decision", decision.get("decision")),
              ("diff_coverage_source", decision.get("diff_coverage_source")),
              ("suite_strength", decision.get("suite_strength")),
              ("foreign_changed_files", mutation.get("foreign_changed_files")),
          ):
              print(f"::notice::evidence {label}={value!r}")

          assert decision["decision"] == "merge", decision["decision"]
          # Coverage was measured from the derived artefact, not asserted.
          assert decision["diff_coverage_source"] == "computed", decision["diff_coverage_source"]
          assert decision["diff_coverage"]["diff_sha256"]
          # ...and strength was actually measured rather than left null.
          assert decision["suite_strength"] is not None, "suite strength was not measured"
          assert decision["mutation"]["foreign_changed_files"] == []
          print("coverage:", decision["diff_coverage_source"],
                "| strength:", decision["suite_strength"])
          PY

  static-analysis:
    # Belt and braces for a gate that runs other people's code: the tool that
    # decides whether a patch is safe should not itself be shipping an obvious
    # injection. bandit at MEDIUM+ (LOW is dominated by "subprocess exists",
    # which is this program's entire job); semgrep on the security-audit pack.
    name: Static analysis (bandit + semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysers
        run: python -m pip install bandit semgrep

      - name: bandit (MEDIUM and above)
        # The two B108 hits on the bwrap argv are mount specifications, not
        # tempfile calls; they carry `# nosec` in the source with the reason
        # on the line above, so this stays a real gate rather than a suppressed one.
        run: bandit -r src -ll

      - name: semgrep (security-audit)
        run: semgrep scan --error --config p/security-audit src/

  coverage:
    # A fail-closed gate with an unmeasured own-suite is the same self-deception
    # it exists to catch. This floors the number so it cannot quietly drop.
    name: Own-suite coverage floor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install . pytest coverage

      # Two independent ways this job can go red, and a log that says only
      # "Measure coverage of src failed" does not tell them apart: the suite
      # itself failing, or the floor failing. The breakdown is therefore
      # printed *before* the floor check and the two exits are named
      # differently. The floor is still enforced -- nothing here passes on a
      # number that was never reached.
      - name: Measure coverage of src
        # bubblewrap is installed on purpose: without it the bwrap tests skip
        # and the same commit measures ~6 points lower, which would make this
        # floor depend on the runner's package list rather than on the code.
        run: |
          # The job log needs push rights to read; annotations do not. So a
          # red job has to carry its own diagnosis here rather than leave it
          # in a log nobody without an admin token can open.
          set +e
          coverage run --source=src -m pytest -q 2>&1 | tee pytest-run.log
          pytest_exit=${PIPESTATUS[0]}
          # Under -e a failing `coverage json` would abort here and the step
          # would go red with no annotation at all -- which is exactly the
          # shape of the previous failure, and why it was undiagnosable.
          coverage json -o coverage.json
          json_exit=$?
          set -e
          if [ "$json_exit" -ne 0 ]; then
            echo "::error title=No coverage data::coverage json exited $json_exit -- coverage run produced no data file"
            TAIL=$(tail -20 pytest-run.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n' | cut -c1-1500)
            echo "::notice title=pytest tail::$TAIL"
            exit "$json_exit"
          fi
          python - <<'PY'
          import json

          data = json.load(open("coverage.json"))
          rows = sorted(
              # Each file entry nests its numbers under "summary"; reading
              # percent_covered off the entry itself raises KeyError, which
              # under -e kills the step before it can annotate anything.
              (path, info["summary"]["percent_covered"])
              for path, info in data["files"].items()
          )
          print(f'{"module":<40} {"coverage":>8}')
          for path, pct in rows:
              print(f"{path:<40} {pct:>7.1f}%")
          total = data["totals"]["percent_covered"]
          print(f'{"TOTAL":<40} {total:>7.1f}%')
          # The number itself, as an annotation, unconditionally: this job's
          # whole question is "is it over the floor", and until now a floor
          # failure emitted nothing at all -- the step simply went red.
          open("coverage-total.txt", "w").write(f"{total:.2f}")
          print(f"::notice title=coverage total::{total:.1f}% against a floor of 87")
          PY
          if [ "$pytest_exit" -ne 0 ]; then
            echo "::error title=Suite failed::pytest exited $pytest_exit -- a test failure, not the coverage floor"
            { grep -E '^(FAILED|ERROR) ' pytest-run.log || true; } | head -8 |
              while IFS= read -r line; do
                echo "::error title=Failing test::$line"
              done
            TAIL=$(tail -20 pytest-run.log | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n' | cut -c1-1500)
            echo "::notice title=pytest tail::$TAIL"
            exit "$pytest_exit"
          fi
          if ! coverage report --fail-under=87; then
            echo "::error title=Coverage floor::$(cat coverage-total.txt)% measured against a floor of 87 -- the floor, not a failing test"
            exit 1
          fi

  demo:
    # The demo is an acceptance test, not a screenshot: if a decision regresses
    # (a deletion stops counting, coverage stops being an evidence question, a
    # precedence flips), this job fails instead of the README quietly going stale.
    name: Live demo (three decisions)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      - name: BLOCK, INCONCLUSIVE and MERGE must all still hold
        run: python demo/demo.py --no-color

      - name: The committed evidence artefacts are well-formed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path("demo/out/evidence_a.json").read_text())
          b = json.loads(Path("demo/out/evidence_b.json").read_text())
          c = json.loads(Path("demo/out/evidence_c.json").read_text())

          assert a["decision"] == "block", a["decision"]
          assert b["decision"] == "inconclusive", b["decision"]
          assert c["decision"] == "merge", c["decision"]

          # AG-002: provenance is recorded next to the number.
          assert b["diff_coverage_source"] == "none"
          assert b["diff_coverage_ratio"] is None
          assert c["diff_coverage_source"] == "computed"
          assert c["diff_coverage"]["diff_sha256"]
          assert c["diff_coverage"]["coverage_json_sha256"]

          # AG-010: ran=True with null exit codes means "ran, patch passed".
          assert a["full_suite_ran"] is True
          assert a["full_suite_exit_codes"] == [0, 1]
          assert c["full_suite_ran"] is True
          assert c["full_suite_exit_codes"] is None
          print("artefacts OK")
          PY

      - name: The README demo GIF is committed
        run: test -s demo/demo.gif

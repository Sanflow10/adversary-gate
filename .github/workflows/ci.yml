name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # AG-005/AG-006: the suite must run against an *installed* package on a
      # clean runner, not against whatever happens to be preinstalled.
      - name: Install package and test dependencies
        run: python -m pip install .

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Run test suite
        run: python -m pytest -q

  package:
    name: Build, install wheel, smoke the CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install the built wheel in a clean interpreter
        run: python -m pip install dist/*.whl

      - name: CLI entry point answers --help
        run: adversary-gate --help

      - name: Installed CLI refuses an untrusted coverage claim
        # The AG-002 contract: a bare --coverage-ratio is a usage error.
        run: |
          mkdir -p fixture/baseline fixture/patch
          printf 'def add(a, b):\n    return a + b\n' > fixture/baseline/calc.py
          printf 'def add(a, b):\n    return a + b\n' > fixture/patch/calc.py
          for d in baseline patch; do
            printf 'from calc import add\n\ndef test_add():\n    assert add(2, 2) == 4\n' \
              > fixture/$d/test_sum.py
          done
          set +e
          adversary-gate \
            --baseline fixture/baseline \
            --patch fixture/patch \
            --test-path test_sum.py \
            --test-id test_add \
            --coverage-ratio 1.0
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 3

  action-smoke:
    name: Composite action on a clean runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the baseline/patch fixture
        run: |
          mkdir -p baseline patch
          printf 'def add(a, b):\n    return a + b\n' > baseline/calc.py
          printf 'def add(a, b):\n    return (a + b)\n' > patch/calc.py
          for d in baseline patch; do
            printf 'from calc import add\n\ndef test_add():\n    assert add(2, 2) == 4\n' \
              > $d/test_sum.py
          done
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("change.diff").write_text(
              "--- a/calc.py\n"
              "+++ b/calc.py\n"
              "@@ -1,2 +1,2 @@\n"
              " def add(a, b):\n"
              "-    return a + b\n"
              "+    return (a + b)\n"
          )
          Path("cov.json").write_text(
              json.dumps({"files": {"calc.py": {"executed_lines": [1, 2]}}})
          )
          PY

      - name: Run AdversaryGate from the repository
        id: gate
        uses: ./
        with:
          baseline: 'baseline'
          patch: 'patch'
          test-path: 'test_sum.py'
          test-id: 'test_add'
          diff: 'change.diff'
          coverage-json: 'cov.json'
          evidence-log: 'evidence.jsonl'

      - name: The gate must merge a clean, measured patch
        run: |
          echo "decision=${{ steps.gate.outputs.decision }}"
          echo "outcome=${{ steps.gate.outputs.outcome }}"
          test "${{ steps.gate.outputs.decision }}" = "merge"
          test "${{ steps.gate.outputs.outcome }}" = "verified"
          test -s evidence.jsonl

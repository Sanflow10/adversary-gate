name: Release

# The GitHub Release for a tag a person already pushed.
#
# The order is fixed, and only the first step is done by hand:
#
#   1. git tag -s vX.Y.Z -m "X.Y.Z" && git push origin vX.Y.Z
#      The push starts pypi-publish.yml, which uploads BOTH distributions --
#      the core and packaging/mcp -- through Trusted Publishing, with PyPI
#      provenance attestations.
#   2. Actions -> Release -> Run workflow, here: tests, the wheel attached to
#      the release, the floating major tag moved.
#
# This workflow used to create the tag itself, with the workflow token, and
# upload the core to PyPI with an API token. Events made by that token start
# no other workflow, so on 3.0.2 and 3.0.3 pypi-publish.yml never ran: the
# MCP package stayed at 3.0.0 -- pinned to the core 3.0.0, under every fix
# 3.0.1 made -- the core files went up with no attestation, and the tags were
# not signed. It now refuses to run without the tag, and never uploads.
#
# What comes out is a wheel attached to a public, unauthenticated URL:
#
#   pip install https://github.com/OWNER/REPO/releases/download/vX.Y.Z/FILE.whl
#
on:
  workflow_dispatch:

permissions:
  contents: write # create the release and move the floating major tag

jobs:
  release:
    name: Build, verify, publish a GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The `v*` tag is pushed by hand on purpose, so that it is a person,
          # not a token, who asks for a release. We build from its tree, and
          # that needs the tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install build pytest

      # Which tree is being released? The version is read from pyproject, never
      # passed as an input: a tag that disagrees with the package metadata is
      # precisely the inconsistency AG-008 recorded, and taking it from one
      # source makes that mismatch unreachable rather than merely unlikely.
      #
      # The build comes from the tag and not from whatever HEAD happens to be
      # now -- otherwise the wheel would not be the tree the tag names, and
      # `pip install <tag>` would not reproduce what is attached to the release.
      #
      # No tag, no release: a tag made here would be made by the workflow
      # token, unsigned, and its push would not start pypi-publish.yml (3.0.2
      # and 3.0.3). A lightweight tag is refused for the same reason -- a
      # signed tag is an annotated one.
      - name: Resolve the release ref
        id: ref
        env:
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail

          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if ! git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::no tag $TAG yet. Push it by hand first: git tag -s $TAG -m \"$VERSION\" && git push origin $TAG -- that push publishes both packages to PyPI with attestations; then run this workflow again"
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; a release needs an annotated, signed one (git tag -s)"
            exit 1
          fi
          # Annotated is not signed: `git tag -a` passes the check above. The
          # signature is checked against the same key pypi-publish.yml uses.
          if [ -z "${ALLOWED_SIGNERS//[[:space:]]/}" ]; then
            echo "::error::the repository variable RELEASE_ALLOWED_SIGNERS is not set: nothing to verify $TAG against"
            exit 1
          fi
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" \
                verify-tag "refs/tags/$TAG"; then
            echo "::error::$TAG is not signed by a key in RELEASE_ALLOWED_SIGNERS"
            exit 1
          fi
          git checkout --quiet "refs/tags/$TAG"

          TAGGED="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAGGED" != "$VERSION" ]; then
            echo "::error::tag $TAG carries version $TAGGED but pyproject says $VERSION"
            exit 1
          fi

          echo "releasing $TAG from its own tree"

      # Fail-closed, same as the gate: a release only ever leaves a build whose
      # tests actually passed. Re-running them here rather than trusting the
      # latest CI run matters because the tag points at whatever tree was just
      # checked out, not at whatever was green an hour ago.
      - name: Refuse to release an untested build
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Install what was just built, in a clean interpreter
        run: |
          python -m pip install dist/*.whl
          adversary-gate --help

      # PyPI is pypi-publish.yml's job, started by the tag push. A release page
      # that goes up while PyPI still lacks one of the two packages is the
      # 3.0.2/3.0.3 state again: `uvx adversary-gate-mcp` serving an older
      # version under a release that says otherwise.
      - name: Refuse while PyPI lacks either package
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for PROJECT in adversary-gate adversary-gate-mcp; do
            if ! curl -fsS -o /dev/null "https://pypi.org/pypi/$PROJECT/$VERSION/json"; then
              echo "::error::PyPI has no $PROJECT $VERSION yet. The push of $TAG runs Actions -> Publish to PyPI; check that run (or start it with tag $TAG), then run this workflow again"
              exit 1
            fi
          done
          echo "PyPI has adversary-gate $VERSION and adversary-gate-mcp $VERSION"

      - name: Create the release and attach the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists -- bump version in pyproject.toml first"
            exit 1
          fi

          # The tag exists (the resolve step refuses otherwise) and is not
          # ours to point anywhere; the resolve step is already standing on
          # its tree, so the release stands on it and --target is not given.
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes

          echo "published $TAG"
          ls -l dist/

      # ``uses: Sanflow10/adversary-gate@v2`` needs a ref that follows the
      # newest 2.x. Only ever moved *forward*: re-releasing an old version must
      # not drag the floating tag back onto it, so it moves only when ``TAG`` is
      # the highest version that shares its major.
      #
      # Pushed with the workflow's own token, so -- like the release tag -- it
      # does not start other workflows.
      - name: Move the floating major tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail

          MAJOR="${TAG%%.*}"                       # v2.1.1 -> v2
          git fetch --force --tags origin
          # Only tags signed by the release key count: an unsigned v3.9.9
          # pushed by anyone with write access was the "newest", and the
          # floating tag never moved again (3.0.8).
          NEWEST=""
          for candidate in $(git tag --list "${MAJOR}.*" | sort -V); do
            if git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" \
                  verify-tag "refs/tags/$candidate" >/dev/null 2>&1; then
              NEWEST="$candidate"
            fi
          done

          if [ "$NEWEST" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest ${MAJOR}.x ($NEWEST is); leaving $MAJOR where it is"
            exit 0
          fi

          git tag --force "$MAJOR" "refs/tags/${TAG}^{commit}"
          git push --force origin "refs/tags/$MAJOR"
          echo "$MAJOR now points at $TAG ($(git rev-parse --short "refs/tags/${TAG}^{commit}"))"

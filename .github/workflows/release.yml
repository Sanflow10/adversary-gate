name: Release

# A release route that does not need PyPI at all.
#
# Deliberately `workflow_dispatch` instead of `on: push: tags: v*`:
#
#   The tag is created *inside* this workflow, by the GITHUB_TOKEN, and events
#   that token produces do not start other workflows. So publishing a release
#   does not fire pypi-publish.yml and leave a red run behind every time --
#   that failure is AG-008, it belongs to whoever holds the PyPI account, and
#   it should not be normalised into the release process while it is
#   unresolved. Push a `v*` tag by hand and it fires; press Run here and it
#   does not.
#
# What comes out is a wheel attached to a public, unauthenticated URL:
#
#   pip install https://github.com/OWNER/REPO/releases/download/vX.Y.Z/FILE.whl
#
on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

jobs:
  release:
    name: Build, verify, publish a GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # A `v*` tag may already be there -- it is pushed by hand on purpose,
          # so that it is a person, not a token, who asks for a release. When
          # it exists we have to build from its tree, and that needs the tags.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install build pytest

      # Which tree is being released? The version is read from pyproject, never
      # passed as an input: a tag that disagrees with the package metadata is
      # precisely the inconsistency AG-008 recorded, and taking it from one
      # source makes that mismatch unreachable rather than merely unlikely.
      #
      # When that tag already exists, the build must come from the tag and not
      # from whatever HEAD happens to be now -- otherwise the wheel would not
      # be the tree the tag names, and `pip install <tag>` would not reproduce
      # what is attached to the release.
      - name: Resolve the release ref
        id: ref
        run: |
          set -euo pipefail

          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "refs/tags/$TAG"

            TAGGED="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            if [ "$TAGGED" != "$VERSION" ]; then
              echo "::error::tag $TAG carries version $TAGGED but pyproject says $VERSION"
              exit 1
            fi

            echo "tag $TAG already exists -- building from its tree"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "no tag yet -- it will be created from HEAD"
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "releasing $TAG"

      # Fail-closed, same as the gate: a release only ever leaves a build whose
      # tests actually passed. Re-running them here rather than trusting the
      # latest CI run matters because the tag points at whatever tree was just
      # checked out, not at whatever was green an hour ago.
      - name: Refuse to release an untested build
        run: python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Install what was just built, in a clean interpreter
        run: |
          python -m pip install dist/*.whl
          adversary-gate --help

      - name: Create the release and attach the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          TAG_EXISTS: ${{ steps.ref.outputs.tag_exists }}
        run: |
          set -euo pipefail

          echo "releasing $TAG (tag_exists=$TAG_EXISTS)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists -- bump version in pyproject.toml first"
            exit 1
          fi

          # `gh release create` makes the tag only when it is missing -- but
          # without --target it points that new tag at the tip of the default
          # branch *at this moment*, not at the tree this job built from. Those
          # are the same commit unless something lands on main during the
          # minutes the suite and the build take, and when they differ the tag
          # stops naming the artefact attached to it: anyone following
          # SECURITY.md to verify a download against `vX.Y.Z` would be checking
          # it against a different tree. So the new-tag path pins the target to
          # the checked-out SHA -- the bytes that were actually built.
          #
          # When the tag already exists it is not ours to point anywhere, and
          # the resolve step is already standing on its tree, so --target is
          # deliberately omitted there.
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "tag $TAG already points somewhere; the release stands on it"
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi

          echo "published $TAG"
          ls -l dist/

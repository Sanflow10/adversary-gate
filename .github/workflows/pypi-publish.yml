name: Publish to PyPI

# Two ways in, one way out to PyPI:
#
#   push of a vX.Y.Z tag  -> publishes that tag (a tag pushed by hand: the
#                            normal route, see release.yml).
#   Run workflow + tag    -> publishes a tag that already exists, e.g. to
#                            finish a run that stopped halfway.
#
# Authentication: Trusted Publishing only. The publisher is registered on
# pypi.org (AG-008) for both projects, `adversary-gate` and
# `adversary-gate-mcp`: owner Sanflow10, repository adversary-gate, workflow
# pypi-publish.yml, no environment. Every file goes up with a PyPI provenance
# attestation tying it to this workflow. An API token used to take precedence
# when the PYPI_API_TOKEN secret existed, and a token upload carries no
# attestation (the core 3.0.1-3.0.3 files): the secret is no longer read.
#
# One tag, two distributions: the core and packaging/mcp (the MCP server as
# its own package, for `uvx adversary-gate-mcp`). Both go up in one upload.

on:
  push:
    tags:
      # Full versions only. A bare `v*` also matched the floating `v2` tag the
      # Release workflow now maintains, which would have started a publish run
      # for a version that is not a release.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v2.2.0'
        required: true

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      # The input is only ever read from the environment, never spliced into a
      # script, so a value with quotes in it is data and not code.
      - name: Resolve the tag to publish
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$PUSHED_TAG"; fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag of the form vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Build from the tag's tree, never from whatever the branch holds now:
      # the files on PyPI have to be the files the tag names.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      # "A person pushes a signed tag" was a convention until here: this
      # workflow checked the tag's name and nothing else, so a lightweight or
      # unsigned tag that matched vX.Y.Z went to PyPI with full attestations.
      # The key that may sign a release lives in a repository variable, not in
      # the tree, so a push cannot bring its own key along with its own tag.
      # No variable, no key match, no signature: no upload.
      - name: The tag is signed by a release key
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          if [ -z "${ALLOWED_SIGNERS//[[:space:]]/}" ]; then
            echo "::error::the repository variable RELEASE_ALLOWED_SIGNERS is not set: nothing to verify $TAG against, so nothing is published"
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; a release needs an annotated, signed one (git tag -s)"
            exit 1
          fi
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          if ! git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" \
                verify-tag "refs/tags/$TAG"; then
            echo "::error::$TAG is not signed by a key in RELEASE_ALLOWED_SIGNERS; nothing is published"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The tag and the package name the same version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG carries version $VERSION in pyproject.toml"
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install build pytest

      # The tag push runs this before the Release workflow, which used to be the
      # only place the suite ran before a release: a build whose tests did not
      # pass must not reach PyPI either.
      - name: Refuse to publish an untested build
        run: python -m pytest -q

      - name: Clean build output
        run: rm -rf dist/

      - name: Build binary wheel and source distribution
        run: python -m build

      # Same version as the core, pinned to it; test_release_consistency.py
      # holds that on main, and this re-checks it on the tag being shipped.
      - name: Build the MCP server package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          MCP_VERSION="$(python -c "import tomllib; print(tomllib.load(open('packaging/mcp/pyproject.toml','rb'))['project']['version'])")"
          if [ "v$MCP_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG but packaging/mcp carries version $MCP_VERSION"
            exit 1
          fi
          python -m build packaging/mcp --outdir dist/

      # No password: the action uses Trusted Publishing and attests each file.
      # skip-existing: a run that stopped halfway (2.9.0: the core wheel went
      # up, then the new project was refused) can be run again for the same
      # tag. PyPI never lets a file be replaced; this skips the files already
      # there instead of failing on them, and uploads the rest.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

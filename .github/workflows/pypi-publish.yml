name: Publish to PyPI

on:
  push:
    tags:
      # Full versions only. A bare `v*` also matched the floating `v2` tag the
      # Release workflow now maintains, which would have started a publish run
      # for a version that is not a release.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install build

      - name: Clean build output
        run: rm -rf dist/

      - name: Build binary wheel and source distribution
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

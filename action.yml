name: 'AdversaryGate'
description: 'Evidence-based fail-closed verification gate for AI coding agents'
author: 'AdversaryGate Authors'
branding:
  icon: 'shield-check'
  color: 'blue'

inputs:
  baseline:
    description: >-
      Path to baseline repository state (before patch). Optional when base-sha
      is given, which materialises the baseline from that commit.
    required: false
  patch:
    description: >-
      Path to patch repository state (after patch). Optional when base-sha is
      given, in which case the current checkout is the patch.
    required: false
  base-sha:
    description: >-
      Git ref for the "before" state. When set, the Action derives everything
      it can from it instead of asking you to hand-build artefacts: it
      materialises `baseline` from this commit, treats the checkout as the
      patch, writes the unified diff from `base-sha...HEAD`, and -- unless
      `coverage-json` is given -- runs `coverage-command` to produce it.
      Requires a full clone, i.e. `fetch-depth: 0` on actions/checkout.
    required: false
  coverage-command:
    description: >-
      Shell command that writes the coverage JSON report to the path in
      $COVERAGE_JSON, run in the patch tree. Only used when base-sha is set
      and coverage-json is not. Default measures a pytest suite with coverage.py.
    required: false
    default: 'coverage run -m pytest || true; coverage json -o "$COVERAGE_JSON"'
  test-path:
    description: 'Relative path to target test file'
    required: true
  test-id:
    description: 'Node ID or test name to verify'
    required: true
  bug-kind:
    description: 'Bug category: deterministic, concurrency, or performance'
    required: false
    default: 'deterministic'
  criterion-id:
    description: 'ID of cited acceptance criterion'
    required: false
  criterion:
    description: 'Acceptance criterion text in ID:TEXT format'
    required: false
  coverage-floor:
    description: 'Minimum required diff coverage ratio (0.0 to 1.0)'
    required: false
    default: '0.80'
  diff:
    description: >-
      Path to a unified diff of the patch. Together with coverage-json this is
      what the gate measures diff coverage from. Required for a MERGE unless
      coverage is deliberately declared untrusted.
    required: false
  coverage-json:
    description: >-
      Path to a coverage.py JSON report (``coverage json``). The other half of
      the measurement.
    required: false
  coverage-ratio:
    description: >-
      A caller-supplied coverage number. This is a claim, not evidence, and is
      rejected unless coverage-source is set to 'untrusted'.
    required: false
  coverage-source:
    description: 'auto (default), computed (requires diff+coverage-json) or untrusted (requires coverage-ratio)'
    required: false
    default: 'auto'
  require-network-isolation:
    description: 'Refuse to run unless ADVERSARY_NETWORK_ISOLATED=1 (declaration check, not isolation)'
    required: false
    default: 'false'
  suite-strength-floor:
    description: 'Minimum required suite strength ratio (0.0 to 1.0)'
    required: false
    default: '0.75'
  evidence-log:
    description: 'Path to save JSONL evidence log artefact'
    required: false
    default: 'evidence.jsonl'
  model:
    description: 'Dynamic identifier of the model or coding agent that produced the patch'
    required: false
  commit:
    description: 'Commit SHA of the patch'
    required: false

outputs:
  decision:
    description: 'Final decision: merge, block, or inconclusive'
    value: ${{ steps.gate.outputs.decision }}
  outcome:
    description: 'Verdict outcome: verified, refuted, or unverified'
    value: ${{ steps.gate.outputs.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # AG-005: the Action used to call src/cli.py on a bare runner. ``pytest`` is
    # a declared dependency of the package but is not present in a clean runner,
    # so the harness died with "No module named pytest" and the gate reported
    # INCONCLUSIVE for reasons unrelated to the patch. Install first, then run.
    # ``coverage`` is not a package dependency: it is here only because this
    # Action may have to produce the coverage artefact itself.
    - name: Install AdversaryGate and its dependencies
      shell: bash
      run: python -m pip install "${{ github.action_path }}" coverage

    # base-sha: one ref in, three artefacts out. Kept in its own step so the
    # separation holds -- the gate measures files, the Action prepares them.
    - name: Prepare evidence from base-sha
      id: prep
      if: inputs.base-sha != ''
      shell: bash
      env:
        AG_BASE_SHA: ${{ inputs.base-sha }}
        AG_COVERAGE_JSON_IN: ${{ inputs.coverage-json }}
        AG_COVERAGE_CMD: ${{ inputs.coverage-command }}
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/adversary-gate"
        mkdir -p "$OUT"

        EXTRA=()
        if [ -n "$AG_COVERAGE_JSON_IN" ]; then
          EXTRA+=(--skip-coverage)
        else
          EXTRA+=(--coverage-file "$OUT/coverage.json")
          if [ -n "$AG_COVERAGE_CMD" ]; then
            EXTRA+=(--coverage-command "$AG_COVERAGE_CMD")
          fi
        fi

        bash "${{ github.action_path }}/scripts/prepare_evidence.sh" \
          --workspace "${GITHUB_WORKSPACE}" \
          --base-sha "$AG_BASE_SHA" \
          --baseline-dir "$OUT/baseline" \
          --diff-file "$OUT/change.diff" \
          "${EXTRA[@]}"

        echo "baseline=$OUT/baseline" >> "$GITHUB_OUTPUT"
        echo "diff=$OUT/change.diff" >> "$GITHUB_OUTPUT"
        if [ -s "$OUT/coverage.json" ]; then
          echo "coverage=$OUT/coverage.json" >> "$GITHUB_OUTPUT"
        fi

    - name: Execute AdversaryGate Verification
      id: gate
      shell: bash
      env:
        AG_BASELINE_IN: ${{ inputs.baseline }}
        AG_PATCH_IN: ${{ inputs.patch }}
        AG_DIFF_IN: ${{ inputs.diff }}
        AG_COVERAGE_JSON_IN: ${{ inputs.coverage-json }}
        AG_PREP_BASELINE: ${{ steps.prep.outputs.baseline }}
        AG_PREP_DIFF: ${{ steps.prep.outputs.diff }}
        AG_PREP_COVERAGE: ${{ steps.prep.outputs.coverage }}
        AG_BASE_SHA: ${{ inputs.base-sha }}
        AG_TEST_PATH: ${{ inputs.test-path }}
        AG_TEST_ID: ${{ inputs.test-id }}
        AG_BUG_KIND: ${{ inputs.bug-kind }}
        AG_COVERAGE_FLOOR: ${{ inputs.coverage-floor }}
        AG_COVERAGE_SOURCE: ${{ inputs.coverage-source }}
        AG_COVERAGE_RATIO: ${{ inputs.coverage-ratio }}
        AG_STRENGTH_FLOOR: ${{ inputs.suite-strength-floor }}
        AG_EVIDENCE_LOG: ${{ inputs.evidence-log }}
        AG_REQUIRE_NET: ${{ inputs.require-network-isolation }}
        AG_CRITERION_ID: ${{ inputs.criterion-id }}
        AG_CRITERION: ${{ inputs.criterion }}
        AG_MODEL: ${{ inputs.model }}
        AG_COMMIT: ${{ inputs.commit }}
      run: |
        # An explicit input wins; what base-sha prepared is the fallback.
        # Reading these from the environment instead of splicing
        # ${{ inputs.* }} straight into the script means a value containing a
        # quote is data rather than a way to end the string.
        pick() { if [ -n "$1" ]; then printf '%s' "$1"; else printf '%s' "$2"; fi; }

        BASELINE="$(pick "$AG_BASELINE_IN" "$AG_PREP_BASELINE")"
        if [ -n "$AG_PATCH_IN" ]; then
          PATCH="$AG_PATCH_IN"
        elif [ -n "$AG_BASE_SHA" ]; then
          PATCH="${GITHUB_WORKSPACE}"
        else
          PATCH=""
        fi
        DIFF="$(pick "$AG_DIFF_IN" "$AG_PREP_DIFF")"
        COVERAGE_JSON="$(pick "$AG_COVERAGE_JSON_IN" "$AG_PREP_COVERAGE")"

        if [ -z "$BASELINE" ] || [ -z "$PATCH" ]; then
          echo "::error::baseline and patch are required -- give both, or give base-sha and let the Action derive them"
          exit 3
        fi
        for candidate in "$BASELINE" "$PATCH"; do
          if [ ! -d "$candidate" ]; then
            echo "::error::not a directory: $candidate"
            exit 3
          fi
        done

        ARGS=(
          --baseline "$BASELINE"
          --patch "$PATCH"
          --test-path "$AG_TEST_PATH"
          --test-id "$AG_TEST_ID"
          --bug-kind "$AG_BUG_KIND"
          --coverage-floor "$AG_COVERAGE_FLOOR"
          --coverage-source "$AG_COVERAGE_SOURCE"
          --suite-strength-floor "$AG_STRENGTH_FLOOR"
          --evidence-log "$AG_EVIDENCE_LOG"
        )
        if [ -n "$DIFF" ]; then
          ARGS+=(--diff "$DIFF")
        fi
        if [ -n "$COVERAGE_JSON" ]; then
          ARGS+=(--coverage-json "$COVERAGE_JSON")
        fi
        if [ -n "$AG_COVERAGE_RATIO" ]; then
          ARGS+=(--coverage-ratio "$AG_COVERAGE_RATIO")
        fi
        if [ "$AG_REQUIRE_NET" = "true" ]; then
          ARGS+=(--require-network-isolation)
        fi
        if [ -n "$AG_CRITERION_ID" ]; then
          ARGS+=(--criterion-id "$AG_CRITERION_ID")
        fi
        if [ -n "$AG_CRITERION" ]; then
          ARGS+=(--criterion "$AG_CRITERION")
        fi
        if [ -n "$AG_MODEL" ]; then
          ARGS+=(--model "$AG_MODEL")
        fi
        if [ -n "$AG_COMMIT" ]; then
          ARGS+=(--commit "$AG_COMMIT")
        fi

        JSON_OUT=$(PYTHONPATH="${{ github.action_path }}/src" python3 "${{ github.action_path }}/src/cli.py" "${ARGS[@]}")
        EXIT_CODE=$?
        echo "$JSON_OUT"

        DECISION=$(echo "$JSON_OUT" | python3 -c "import sys, json; print(json.load(sys.stdin).get('decision', 'inconclusive'))" 2>/dev/null || echo "inconclusive")
        OUTCOME=$(echo "$JSON_OUT" | python3 -c "import sys, json; print(json.load(sys.stdin).get('outcome', 'unverified'))" 2>/dev/null || echo "unverified")

        echo "decision=${DECISION}" >> $GITHUB_OUTPUT
        echo "outcome=${OUTCOME}" >> $GITHUB_OUTPUT

        exit $EXIT_CODE

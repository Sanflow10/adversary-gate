[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversary-gate"
version = "2.14.1"
description = "Evidence-based verification gate for AI coding agents (fail-closed)"
readme = "README.md"
authors = [
    {name = "AdversaryGate Authors", email = "sanflow086@gmail.com"}
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://sanflow10.github.io/adversary-gate/"
Documentation = "https://github.com/Sanflow10/adversary-gate#readme"
Repository = "https://github.com/Sanflow10/adversary-gate.git"
Issues = "https://github.com/Sanflow10/adversary-gate/issues"

[project.optional-dependencies]
# The MCP server for coding agents (Hermes, Claude Code, ...). coverage is what
# lets it derive the evidence from a git working tree on its own. 1.14 is the
# oldest SDK measured to register both tools (1.9.4, 1.12 and 1.13 fail in tool()).
mcp = ["mcp>=1.14", "coverage>=7"]

[project.scripts]
adversary-gate = "adversary_gate.cli:main"
adversary-gate-mcp = "adversary_gate.integrations.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["adversary_gate*"]

[tool.setuptools.package-data]
"adversary_gate.integrations" = ["hermes/*.md", "hermes/*.yaml"]
